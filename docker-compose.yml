version: '3.8'

services:
  # Target application (mock banking system)
  target-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: computer-use-target-app
    ports:
      - "8080:8080"
    volumes:
      - ./target-app:/app/target-app
      - ./logs:/app/logs
      - ./evidence:/app/evidence
    environment:
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs
      - EVIDENCE_DIR=/app/evidence
    restart: unless-stopped
    command: python -m http.server 8080 --directory /app/target-app

  # Automation service (can be scaled)
  automation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: computer-use-worker
    volumes:
      - ./src:/app/src
      - ./evidence:/app/evidence
      - ./logs:/app/logs
      - ./main.py:/app/main.py
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - TARGET_APP_URL=http://target-app:8080
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs
      - EVIDENCE_DIR=/app/evidence
      - ALLOWED_DOMAINS=localhost,127.0.0.1,target-app
    depends_on:
      - target-app
    restart: unless-stopped
    command: tail -f /dev/null

networks:
  default:
    name: automation-network