name: CI Pipeline

on:
  push:
    branches: [ main, "remediation/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Live Headless Replay
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Install Playwright Chromium
      run: |
        playwright install --with-deps chromium

    - name: Setup Environment File
      run: cp .env.example .env

    - name: Start Target App Web Server
      run: |
        python -m http.server 8080 --directory target-app &
        sleep 2

    - name: Run Pytest Suite
      run: |
        python -m pytest -v

    - name: Run Baseline Audit Probe
      run: |
        python tests/probe_audit.py

    - name: Exercise Live Headless Replay (Success Path)
      run: |
        python main.py replay --artifact evidence/artifacts/lookup_member_balance.json --params '{"member_id":"67890"}'

    - name: Exercise Live Headless Replay (Business Outcome Path)
      run: |
        python main.py replay --artifact evidence/artifacts/lookup_member_balance.json --params '{"member_id":"99999"}'
